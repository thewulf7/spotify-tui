[package]
name = "spotify-tui"
description = "A terminal user interface for Spotify"
homepage = "https://github.com/Rigellute/spotify-tui"
documentation = "https://github.com/Rigellute/spotify-tui"
repository = "https://github.com/thewulf7/spotify-tui"
keywords = ["spotify", "tui", "cli", "terminal"]
categories = ["command-line-utilities"]
version = "0.29.8"
authors = ["Alexander Keliris <rigellute@gmail.com>"]
edition = "2018"
license = "MIT OR Apache-2.0"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
rspotify = "0.10.0"
tui = { version = "0.16.0", features = ["crossterm"], default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.8"
dirs = "3.0.2"
clap = "2.33.3"
unicode-width = "0.1.8"
backtrace = "0.3.57"
arboard = "1.2.0"
crossterm = "0.20"
tokio = { version = "0.2", features = ["full"] }
rand = "0.8.4"
anyhow = "1.0.43"
librespot-oauth = "0.8.0"
chrono = "0.4"
base64 = "0.22"
librespot-core = "0.8.0"
librespot-connect = "0.8.0"
librespot-playback = { version = "0.8.0", default-features = false, features = ["rodio-backend"] }
tokio1 = { package = "tokio", version = "1", features = ["rt", "rt-multi-thread", "macros", "sync", "time"] }
image = { version = "0.23", default-features = false, features = ["jpeg", "png"] }

[patch.crates-io]
rspotify = { path = "vendor/rspotify_patch" }
librespot-core = { path = "vendor/librespot_core_patch" }

[[bin]]
bench = false
path = "src/main.rs"
name = "spt"
